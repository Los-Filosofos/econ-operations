   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #164f7c" x="154.8504" y="192.485966" transform="rotate(-0 154.8504 192.485966)">Asignación</text>
   </g>
   <g id="text_7">
