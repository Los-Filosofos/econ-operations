   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #164f7c" x="482.4" y="94.323322" transform="rotate(-0 482.4 94.323322)">Envío del movimiento</text>
   </g>
   <g id="text_11">
